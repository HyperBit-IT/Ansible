---
- name: Rocky | Hardening base
  hosts: rocky
  become: true
  gather_facts: true

  vars:
    hardening_ssh_port: "{{ ansible_port | default(22) }}"
    hardening_disable_password_auth: false
    hardening_firewalld_allow_tcp_ports: []
    hardening_sysctl:
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.icmp_echo_ignore_broadcasts: "1"
      net.ipv4.ip_forward: "0"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_redirects: "0"
      net.ipv6.conf.default.accept_redirects: "0"

  pre_tasks:
    - name: Verifica che il sistema sia Rocky Linux
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Rocky"
        fail_msg: "Questo playbook va eseguito solo su Rocky Linux."

  tasks:
    - name: Installa strumenti di base
      ansible.builtin.dnf:
        name:
          - dnf-automatic
          - dnf-plugins-core
          - epel-release
          - firewalld
        state: present

    - name: Installa fail2ban
      ansible.builtin.dnf:
        name: fail2ban
        state: present

    - name: Limita dnf-automatic agli aggiornamenti security
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "^upgrade_type ="
        line: "upgrade_type = security"

    - name: Abilita applicazione aggiornamenti dnf-automatic
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "^apply_updates ="
        line: "apply_updates = yes"

    - name: Abilita timer dnf-automatic
      ansible.builtin.service:
        name: dnf-automatic.timer
        enabled: true
        state: started

    - name: Crea directory configurazioni SSH
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Assicura include configurazioni SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: Include /etc/ssh/sshd_config.d/*.conf
        insertbefore: BOF
        validate: /usr/sbin/sshd -t -f %s
      notify: Riavvia SSHD

    - name: Configura hardening SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PermitRootLogin no
          X11Forwarding no
          MaxAuthTries 4
          ClientAliveInterval 300
          ClientAliveCountMax 2
          {% if hardening_disable_password_auth | bool %}
          PasswordAuthentication no
          {% endif %}
      notify: Riavvia SSHD

    - name: Scrive parametri kernel sicuri
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for key, value in hardening_sysctl.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
      notify: Ricarica sysctl

    - name: Configura jail SSH fail2ban
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = {{ hardening_ssh_port }}
          backend = systemd
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: Riavvia fail2ban

    - name: Abilita fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Abilita firewalld
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started

    - name: Verifica porta SSH su firewalld
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --query-port={{ hardening_ssh_port }}/tcp"
      register: firewalld_ssh
      changed_when: false
      failed_when: false

    - name: Consenti porta SSH su firewalld
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --add-port={{ hardening_ssh_port }}/tcp"
      when: firewalld_ssh.rc != 0
      changed_when: true
      notify: Ricarica firewalld

    - name: Verifica porte TCP aggiuntive su firewalld
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --query-port={{ item }}/tcp"
      register: firewalld_extra
      changed_when: false
      failed_when: false
      loop: "{{ hardening_firewalld_allow_tcp_ports }}"

    - name: Consenti porte TCP aggiuntive su firewalld
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --add-port={{ item.item }}/tcp"
      when: item.rc != 0
      changed_when: true
      loop: "{{ firewalld_extra.results | default([]) }}"
      notify: Ricarica firewalld

  handlers:
    - name: Riavvia SSHD
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Riavvia fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Ricarica firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      changed_when: true

    - name: Ricarica sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
