---
- name: Ubuntu | Installa pacchetti base
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    ubuntu_base_packages:
      - ca-certificates
      - curl
      - git
      - jq
      - rsync
      - tmux
      - unzip
      - vim

  pre_tasks:
    - name: Verifica che il sistema sia Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "Questo playbook va eseguito solo su Ubuntu."

  tasks:
    - name: Aggiorna la cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installa pacchetti base
      ansible.builtin.apt:
        name: "{{ ubuntu_base_packages }}"
        state: present
