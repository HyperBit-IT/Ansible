---
- name: Ubuntu | Hardening base
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    hardening_ssh_port: "{{ ansible_port | default(22) }}"
    hardening_disable_password_auth: false
    hardening_ufw_allow_tcp_ports: []
    hardening_sysctl:
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.icmp_echo_ignore_broadcasts: "1"
      net.ipv4.ip_forward: "0"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_redirects: "0"
      net.ipv6.conf.default.accept_redirects: "0"

  pre_tasks:
    - name: Verifica che il sistema sia Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "Questo playbook va eseguito solo su Ubuntu."

  tasks:
    - name: Installa strumenti di hardening
      ansible.builtin.apt:
        name:
          - fail2ban
          - unattended-upgrades
          - ufw
        update_cache: true
        cache_valid_time: 3600
        state: present

    - name: Abilita aggiornamenti automatici di sicurezza
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Crea directory configurazioni SSH
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Assicura include configurazioni SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: Include /etc/ssh/sshd_config.d/*.conf
        insertbefore: BOF
        validate: /usr/sbin/sshd -t -f %s
      notify: Riavvia SSH

    - name: Configura hardening SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PermitRootLogin no
          X11Forwarding no
          MaxAuthTries 4
          ClientAliveInterval 300
          ClientAliveCountMax 2
          {% if hardening_disable_password_auth | bool %}
          PasswordAuthentication no
          {% endif %}
      notify: Riavvia SSH

    - name: Scrive parametri kernel sicuri
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for key, value in hardening_sysctl.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
      notify: Ricarica sysctl

    - name: Configura jail SSH fail2ban
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = {{ hardening_ssh_port }}
          backend = systemd
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: Riavvia fail2ban

    - name: Abilita fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Imposta policy UFW in ingresso
      ansible.builtin.command:
        cmd: ufw default deny incoming
      register: ufw_default_incoming
      changed_when: "'Default incoming policy changed' in ufw_default_incoming.stdout"

    - name: Imposta policy UFW in uscita
      ansible.builtin.command:
        cmd: ufw default allow outgoing
      register: ufw_default_outgoing
      changed_when: "'Default outgoing policy changed' in ufw_default_outgoing.stdout"

    - name: Consenti porta SSH su UFW
      ansible.builtin.command:
        cmd: "ufw allow {{ hardening_ssh_port }}/tcp"
      register: ufw_allow_ssh
      changed_when: "'Rule added' in ufw_allow_ssh.stdout or 'Rules updated' in ufw_allow_ssh.stdout"

    - name: Consenti porte TCP aggiuntive su UFW
      ansible.builtin.command:
        cmd: "ufw allow {{ item }}/tcp"
      register: ufw_allow_extra
      changed_when: "'Rule added' in ufw_allow_extra.stdout or 'Rules updated' in ufw_allow_extra.stdout"
      loop: "{{ hardening_ufw_allow_tcp_ports }}"

    - name: Legge stato UFW
      ansible.builtin.command:
        cmd: ufw status
      register: ufw_status
      changed_when: false

    - name: Abilita UFW
      ansible.builtin.command:
        cmd: ufw --force enable
      when: "'Status: active' not in ufw_status.stdout"
      changed_when: true

  handlers:
    - name: Riavvia SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Riavvia fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Ricarica sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
